apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: travelo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: mouhcineayoub/travelo-backend:1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: travelo-config
            - secretRef:
                name: travelo-secret
          startupProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: travelo
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080